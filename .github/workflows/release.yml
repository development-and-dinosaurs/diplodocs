name: 🦕 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: 🦕 Build Binaries & Release
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Build Binary (${{ matrix.os }}/${{ matrix.arch }})
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          OUTPUT_NAME="diplodocs-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build -ldflags="-s -w" -o "dist-bin/${OUTPUT_NAME}" ./cmd/diplodocs
          cd dist-bin
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip "diplodocs-${{ matrix.os }}-${{ matrix.arch }}.zip" "${OUTPUT_NAME}"
          else
            tar -czvf "diplodocs-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "${OUTPUT_NAME}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-bin/*.*

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all built binaries
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum *.* > checksums.txt || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true

      - name: Update Floating Major Version Tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR_TAG="v${BASH_REMATCH[1]}"
            echo "🦕 Updating floating major tag ${MAJOR_TAG} to point to ${TAG} (${GITHUB_SHA})..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -fa "${MAJOR_TAG}" "${GITHUB_SHA}" -m "Release ${MAJOR_TAG} (${TAG})"
            git push origin "${MAJOR_TAG}" --force
            echo "✅ Floating major tag ${MAJOR_TAG} updated successfully."
          else
            echo "ℹ️ Tag ${TAG} is not a full semver release (vX.Y.Z); skipping major tag update."
          fi
